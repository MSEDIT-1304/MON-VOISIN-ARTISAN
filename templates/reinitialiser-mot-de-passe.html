{% extends "base.html" %}

{% block title %}Réinitialiser votre mot de passe - Mon Voisin Artisan{% endblock %}

{% block content %}

<h1>Réinitialiser votre mot de passe</h1>

<p>
    Saisissez votre adresse e-mail et choisissez votre nouveau mot de passe.
</p>

<div class="form">

    <form method="POST" action="/reinitialiser-mot-de-passe">

        <label for="email">
            Adresse e-mail
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="password">
            Nouveau mot de passe
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <label for="password2">
            Confirmer le nouveau mot de passe
        </label>

        <input
            type="password"
            id="password2"
            name="password2"
            required
        >

        <button type="submit" class="btn">
            Réinitialiser mon mot de passe
        </button>

    </form>

</div>

<p>
    <a href="/connexion">
        Retour à la connexion
    </a>
</p>

{% endblock %}
